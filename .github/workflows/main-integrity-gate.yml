name: Main integrity gate

# GitHub-hosted runners are manual while account minutes are unavailable.
# The same commands are executed and recorded by the local CI evidence gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-and-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openclaw_router_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openclaw_router_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Router test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --require-hashes \
            -r openclaw-tag-router/requirements-test.txt
          python -c 'from playwright.sync_api import sync_playwright; print("Playwright import: OK")'

      - name: Verify Planner 1.1 amendment and frozen test
        run: |
          test ! -e openclaw-tag-router/openclaw_app/services/production_reconciliation_planner_legacy.py
          if grep -q '_legacy' openclaw-tag-router/openclaw_app/services/production_reconciliation_planner.py; then
            printf 'legacy marker found in production reconciliation planner\n' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import hashlib

          checks = {
              Path('acceptance/human/PR-REL-PLANNER/amendment-20260826.md'):
                  '9140a93b35aa3349b28c5fe453891fad4077182154e3de6bd4df0455791e942a',
              Path('openclaw-tag-router/tests/test_production_reconciliation_planner.py'):
                  'b3deaca939d4b6746659c1e0a83e47c923857242f06218f7d95f8a13ac07e898',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch: {path}: {actual} != {expected}')
          print('planner 1.1 binding: OK')
          PY

      - name: Run protected release suites
        working-directory: openclaw-tag-router
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_production_reconciliation_planner.py \
            tests/test_production_reconciliation_regressions.py \
            tests/test_production_reconciliation_contract_boundary.py \
            tests/test_production_release_manifest.py \
            tests/test_stage2_release_gate.py \
            tests/test_stage2_gateway.py \
            tests/test_stage2_production.py \
            tests/test_stage2_server_context.py \
            tests/test_stage2_runtime.py \
            tests/test_stage2_runtime_hardening.py \
            tests/test_stage2_feishu_hardening.py \
            tests/test_stage2_main_integration.py

      - name: Run complete Router suite
        working-directory: openclaw-tag-router
        env:
          ROUTER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/openclaw_router_test_ci
          ROUTER_PYTEST_REPORT_DIR: ${{ runner.temp }}/router-pytest-report
        run: ROUTER_TEST_PYTHON="$(command -v python)" scripts/qa/run_router_pytest.sh

      - name: Upload Router pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-pytest-report
          path: ${{ runner.temp }}/router-pytest-report
          if-no-files-found: warn
          retention-days: 14

      - name: Compile and diff hygiene
        run: |
          python -m compileall -q openclaw-tag-router/openclaw_app openclaw-tag-router/tests
          git diff --check origin/main...HEAD || git diff --check HEAD^

      - name: Remote branch convergence gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          allow="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          python scripts/repository/check_remote_branch_divergence.py \
            --main-ref origin/main \
            --allow-branch "$allow"
