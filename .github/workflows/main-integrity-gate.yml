name: Main integrity gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/planner-contract-repair-20260826

permissions:
  contents: read

jobs:
  router-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Router test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install \
            pytest pyyaml requests bcrypt 'psycopg[binary]' openai python-dotenv \
            beautifulsoup4 lxml feedparser httpx cryptography pillow

      - name: Verify planner v2 binding and frozen test
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          checks = {
              Path('docs/production-reconciliation/20260825/acceptance-fragments/PR-REL-PLANNER/acceptance-contract-v2.md'):
                  'b92b59c1b56df6d0edb6554f3c048a0f846b871421a6ebe242ca96a97eca42e4',
              Path('acceptance/human/PR-REL-PLANNER/checklist-v2.md'):
                  '0a340369cabdff6a1a50bf807477f88ed16a331639331df756965fdef35537b9',
              Path('openclaw-tag-router/tests/test_production_reconciliation_planner.py'):
                  'b3deaca939d4b6746659c1e0a83e47c923857242f06218f7d95f8a13ac07e898',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch: {path}: {actual} != {expected}')
          legacy = Path('openclaw-tag-router/openclaw_app/services/production_reconciliation_planner_legacy.py')
          if legacy.exists():
              raise SystemExit('legacy planner copy must not exist')
          print('planner v2 binding: OK')
          PY

      - name: Run protected release suites
        working-directory: openclaw-tag-router
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_production_reconciliation_planner.py \
            tests/test_production_reconciliation_regressions.py \
            tests/test_production_release_manifest.py \
            tests/test_stage2_gateway.py \
            tests/test_stage2_production.py \
            tests/test_stage2_server_context.py \
            tests/test_stage2_runtime.py \
            tests/test_stage2_runtime_hardening.py \
            tests/test_stage2_feishu_hardening.py \
            tests/test_stage2_main_integration.py

      - name: Run complete Router suite
        working-directory: openclaw-tag-router
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests

      - name: Compile and diff hygiene
        run: |
          python -m compileall -q openclaw-tag-router/openclaw_app openclaw-tag-router/tests
          git diff --check origin/main...HEAD || git diff --check HEAD^

      - name: Remote branch convergence gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          failed=0
          while IFS= read -r ref; do
            name="${ref#refs/remotes/origin/}"
            [[ "$name" == "main" ]] && continue
            unique=$(git rev-list --count HEAD.."$ref")
            if [[ "$unique" != "0" ]]; then
              echo "UNMERGED: $name has $unique commit(s) not contained in candidate HEAD"
              git log --oneline --decorate -n 20 HEAD.."$ref"
              failed=1
            else
              echo "CONVERGED: $name"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)
          exit "$failed"
