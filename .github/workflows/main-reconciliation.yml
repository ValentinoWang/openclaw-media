name: Main reconciliation

on:
  push:
    branches:
      - codex/main-reconciliation-20260826
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: main-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml 'psycopg[binary]' bcrypt requests
      - name: Materialize bounded source patch when bootstrap is present
        run: |
          if test -f scripts/reconcile_main_bundle.py; then
            python scripts/reconcile_main_bundle.py
          fi
      - name: Verify deterministic source patches
        run: python scripts/reconcile_main_source.py --check
      - name: Run protected reconciliation suite
        run: |
          cd openclaw-tag-router
          PYTHONPATH=. python -m pytest -q \
            tests/test_stage2_main_integration.py \
            tests/test_stage2_runtime_hardening.py \
            tests/test_stage2_feishu_hardening.py \
            tests/test_stage2_gateway.py \
            tests/test_stage2_production.py \
            tests/test_stage2_server_context.py \
            tests/test_production_reconciliation_planner.py \
            tests/test_production_reconciliation_regressions.py
          PYTHONPATH=. python -m compileall -q openclaw_app tests
          git diff --check
      - name: Commit bounded patches to the single reconciliation branch
        if: github.event_name == 'push'
        run: |
          if ! test -f scripts/reconcile_main_bundle.py; then
            echo 'Final source tree already materialized.'
            exit 0
          fi
          git config user.name 'OpenClaw Reconciliation Bot'
          git config user.email '105099467+ValentinoWang@users.noreply.github.com'
          git rm -r scripts/reconcile_main_bundle.py scripts/reconcile_payload
          git add -A
          if git diff --cached --quiet; then
            echo 'No source patch commit required.'
            exit 0
          fi
          git commit -m 'chore(reconcile): apply bounded source patches'
          git push origin HEAD:${{ github.ref_name }}
