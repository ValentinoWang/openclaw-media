name: Main reconciliation gate

on:
  push:
    branches:
      - main
      - codex/main-reconciliation-fix-20260826
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Router test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest pytest-asyncio pyyaml requests bcrypt 'psycopg[binary]' \
            pillow python-docx openpyxl beautifulsoup4 markdown
      - name: Verify Planner contract repair
        run: |
          test ! -e openclaw-tag-router/openclaw_app/services/production_reconciliation_planner_legacy.py
          ! grep -q '_legacy' openclaw-tag-router/openclaw_app/services/production_reconciliation_planner.py
          git diff --exit-code ef7e1d32c3360c8bd548286ea3e64bb8f287bbd8 -- \
            openclaw-tag-router/tests/test_production_reconciliation_planner.py
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          path = Path('acceptance/human/PR-REL-PLANNER/amendment-20260826.md')
          assert sha256(path.read_bytes()).hexdigest() == '9140a93b35aa3349b28c5fe453891fad4077182154e3de6bd4df0455791e942a'
          PY
      - name: Run protected Planner and release tests
        working-directory: openclaw-tag-router
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_production_reconciliation_planner.py \
            tests/test_production_reconciliation_regressions.py \
            tests/test_production_reconciliation_contract_boundary.py \
            tests/test_production_release_manifest.py \
            tests/test_stage2_release_gate.py
      - name: Run full Router suite
        working-directory: openclaw-tag-router
        run: PYTHONPATH=. python -m pytest -q tests
      - name: Compile Router source
        working-directory: openclaw-tag-router
        run: PYTHONPATH=. python -m compileall -q openclaw_app tests
      - name: Check remote branch convergence
        run: |
          allow="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          python scripts/repository/check_remote_branch_divergence.py --allow-branch "$allow"
      - name: Diff hygiene
        run: git diff --check
