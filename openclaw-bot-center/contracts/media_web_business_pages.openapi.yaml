paths:
  /session:
    get:
      operationId: getMediaSession
      summary: Read current Media Web session.
      security:
      - cookieAuth: []
      x-permission: shared-session
      parameters: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-page-contracts:
      - shared
      x-runtime-status: existing_typed
  /capabilities:
    get:
      operationId: listMediaCapabilities
      summary: List public Media capabilities.
      security:
      - cookieAuth: []
      x-permission: shared-session
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-page-contracts:
      - shared
      x-runtime-status: existing_typed
  /capability-match:
    post:
      operationId: matchMediaCapability
      summary: Match an intent to one canonical capability.
      security:
      - cookieAuth: []
      x-permission: shared-session
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/IdempotencyHeader'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityMatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityMatchRequest'
      x-page-contracts:
      - shared
      x-runtime-status: existing_typed
  /uploads:
    post:
      operationId: createMediaUpload
      summary: Create a bounded task upload.
      security:
      - cookieAuth: []
      x-permission: shared-session
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/IdempotencyHeader'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReceiptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      x-page-contracts:
      - shared
      x-runtime-status: existing_typed
  /tasks:
    get:
      operationId: listMediaTasks
      summary: List tasks for the session tenant.
      security:
      - cookieAuth: []
      x-permission: shared-session
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaTaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-page-contracts:
      - shared
      x-runtime-status: existing_typed
    post:
      operationId: createMediaTask
      summary: Create a canonical Media task.
      security:
      - cookieAuth: []
      x-permission: ordinary-session
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/IdempotencyHeader'
      responses:
        '202':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaTaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaTaskRequest'
      x-page-contracts:
      - B02
      - B03
      - B04
      - B05
      - B06
      - B07
      x-runtime-status: existing_typed
      x-canonical-capability-id:
      - account_track_strategy
      - activity_archive
      - commercial_brief
      - commercial_delivery_draft
      - creation_checklist_lookup
      - creation_decision_brief
      - creator_profile_upsert
      - external_research_brief
      - id_business
      - media_growth_review
      - platform_hotlist
      - post_review_signal
      - publishing_pack_build
      - selfmedia_cognition_accumulation
      - selfmedia_creation
      - selfmedia_creation_consultation
      - selfmedia_data_review
      - shooting_execution_plan
      - source_asset_intake
      - style_polish_run
      - track_creator_membership_query
      - track_registry_lookup
      - viral_deconstruction
      - vlog_inspiration_capture
      - work_acceptance_report
      x-existing-handler:
      - handle_creation
      - handle_generic.media_review
      - handle_id_business
      - handle_media_growth
      - handle_media_growth_review
      - handle_selfmedia_cognition
      - handle_shooting_execution
      - handle_style_polish
      - handle_作品验收
      - handle_创作咨询
