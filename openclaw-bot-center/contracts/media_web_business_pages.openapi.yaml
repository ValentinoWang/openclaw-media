x-openclaw-permission-matrix:
  ordinary:
    tenantSource: verified_session
    acceptsCallerTenantId: false
    crossTenantRead: false
  admin:
    defaultResponse: redacted_aggregate
    crossTenantRead:
      requires:
      - publicTenantId
      - X-Audit-Reason
      auditWrite: immutable
      missingResource: 404_resource_not_found
  mutations:
    requires:
    - X-OpenClaw-CSRF
    - Idempotency-Key
    mutableObjectsRequireExpectedRevision: true
    writeReadback: true
x-openclaw-document-contract:
  interfaceFreezeVersion: 2
  canonicalBodySchema: media.document.body.v1
  artifactKinds:
  - research_snapshot
  - asset_digest
  - decision_brief
  - creation_document
  - publishing_package
  - review_report
  - project_summary
  authorityByWorkspace:
    personal_web:
      internal:
      - research_snapshot
      - asset_digest
      - decision_brief
      - creation_document
      - publishing_package
      - review_report
      - project_summary
      lark: []
    organization_lark:
      internal:
      - publishing_package
      - project_summary
      lark:
      - research_snapshot
      - asset_digest
      - decision_brief
      - creation_document
      - review_report
  noSecondEditableBody: true
  readyRevisionImmutable: true
  autosaveUpdatesDraftOnly: true
  regenerationCreatesRevision: true
  nonCanonicalFormats:
  - markdown
  - html
  - editor_private_json
  - lark_block_json
  - docx
  - pdf
  export:
    sourceRevisionState: ready
    formats:
    - docx
    - pdf
    states:
    - queued
    - rendering
    - ready
    - failed
    idempotencyIdentity:
    - publicArtifactId
    - revision
    - format
    - templateVersion
    - rendererVersion
    storage: controlled_object_storage
    download: short_lived_controlled_url
  larkNativeBlocks:
    managedBlockMapping:
      paragraph: text
      heading_1: heading_1
      heading_2: heading_2
      heading_3: heading_3
      heading_4: heading_4
      heading_5: heading_5
      heading_6: heading_6
      heading_7: heading_7
      heading_8: heading_8
      heading_9: heading_9
      bullet_list: bullet
      ordered_list: ordered
      todo_item: todo
      quote: quote_or_quote_container
      code_block: code
      divider: divider
      callout: callout
      image: image
      attachment: file
      table: native_table
      data_snapshot: native_table_with_optional_static_chart
    tableRootBlockType: 31
    tableCellBlockType: 32
    maxRowsPerTable: 9
    maxColumnsPerTable: 9
    maxCellsPerTable: 81
    rowsPerSplitTable: 8
    repeatHeaderOnSplit: true
    tooManyColumnsError: lark_table_shape_unsupported
    protectedBlocks:
    - whiteboard
    - bitable
    - sheet
    - embed
    - synced_block
    - third_party_widget
    - agenda
    - okr
    - mind_note
    - flowchart
    - lark_task
    protectedBlockPolicy: preserve_and_fail_on_targeted_update_or_export
    writeReadback:
    - remote_document_version
    - native_table_count
    - table_headers
    - block_order
    - body_checksum
  errorCodes:
  - document_revision_conflict
  - unsupported_document_block
  - lark_table_shape_unsupported
