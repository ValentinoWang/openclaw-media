openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OpenClaw Media Web Business Pages API
  version: 2.0.0
  description: Interface freeze for the nine ordinary-user and five administrator business pages. Existing routes are extended
    in place; W1 surfaces are excluded.
servers:
- url: /openclaw/media/api
x-openclaw-stage1-provisioning:
  controlPlaneBasePath: /openclaw/media/api/organization/provision
  schemaVersion: media.stage1.provision.v1
  routes:
  - method: GET
    path: /runs/{provisionRunId}
    operation: readProvisionStatus
  - method: POST
    path: /confirm
    operation: confirmOrganizationInstallation
  - method: POST
    path: /start
    operation: startOrganizationProvision
  - method: POST
    path: /deprovision
    operation: deprovisionOrganization
  identityFields:
  - tenantId
  - installationId
  - openId
  - bindingId
  browserIdentityFields: forbidden
  documentWriteAuthority: disabled_in_stage1
x-openclaw-interface-freeze-version: 4
x-openclaw-media-stage1-shared-v1:
  contractVersion: media-stage1-shared-v1
  interfaceFreezeVersion: 4
  authority:
    mediaWebCarrier: media_web_business_pages.openapi.yaml
    uniqueCarrierGlob: media_web_business_pages*.openapi.yaml
    noSecondOpenApiDocument: true
  identity:
    sessionPrincipal: '#/components/schemas/SessionPrincipalV2'
    persistedPermanentUserType: false
    identityLinking: explicit_user_confirmation_only
    automaticMerge: forbidden
    authorizationSources:
    - server_session
    - tenant_membership
    - active_binding
  workspace:
    resolutionResult: '#/components/schemas/WorkspaceResolutionResult'
    candidateSchemas:
    - '#/components/schemas/WorkspaceCandidatePersonal'
    - '#/components/schemas/WorkspaceCandidateOrganization'
    authorization: server_only
  organization:
    identityLinkReceipt: '#/components/schemas/UserLarkIdentityLinkReceipt'
    membership: '#/components/schemas/TenantMembership'
    binding: '#/components/schemas/Binding'
    bindingGeneration: '#/components/schemas/BindingGeneration'
  provision:
    installationReceipt: '#/components/schemas/ProvisionInstallationReceipt'
    runReceipt: '#/components/schemas/ProvisionRunReceipt'
    stepReceipt: '#/components/schemas/ProvisionStepReceipt'
    stateVocabulary:
      installation:
      - RECEIVED
      - VERIFIED
      - REJECTED
      - REVOKED
      - NEEDS_ATTENTION
      run:
      - QUEUED
      - RUNNING
      - COMPLETED
      - FAILED
      - NEEDS_ATTENTION
      - CANCELLED
      step:
      - PENDING
      - RUNNING
      - SUCCEEDED
      - FAILED
      - SKIPPED
      - NEEDS_ATTENTION
      - COMPENSATING
      - COMPENSATED
  errors:
    response: '#/components/schemas/MediaStage1ErrorResponse'
    code: '#/components/schemas/MediaStage1ErrorCode'
    closed: true
  evidence:
    identity: '#/components/schemas/EvidenceIdentity'
    levels:
    - source
    - fixture
    - local-runtime
    - external-system
    - production
  security:
    session:
      type: opaque_server_session
      serverStateRequired: true
      absoluteLifetime: 8h
      absoluteLifetimeSeconds: 28800
      rememberMe: false
      rotationTriggers:
      - login_success
      - privilege_change
      - password_reset
      tokenEntropyBits: 256
      cookie:
        name: openclaw_session
        secure: true
        httpOnly: true
        sameSite: Lax
    csrf:
      headerName: X-OpenClaw-CSRF
      requiredForMutations: true
      binding: session
      rotatesWithSession: true
    rateLimit:
      dimensions:
      - source
      - account
      enforceAllDimensions: true
      defaults:
        login:
          windowSeconds: 60
          maxRequestsBySource: 10
          maxRequestsByAccount: 5
        verification_resend:
          windowSeconds: 3600
          maxRequestsBySource: 5
          maxRequestsByAccount: 3
        password_recovery:
          windowSeconds: 3600
          maxRequestsBySource: 5
          maxRequestsByAccount: 3
      defaultBounds:
        maxWindowSeconds: 86400
        maxRequestsPerDimension: 100
      runtimeOverrides:
        policy: stricter_only
        maxRequests: decrease_only
        windowSeconds: decrease_only
        dimensions: cannot_remove
