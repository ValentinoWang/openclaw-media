          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permission: ordinary-session
      x-page-contracts:
      - B01
      - B02
      - B03
      - B04
      - B05
      - B06
      - B07
      x-runtime-status: new
  /documents/{publicArtifactId}/exports:
    post:
      summary: Create or return the idempotent DOCX or PDF export for one ready revision.
      operationId: createDocumentExport
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/PublicArtifactId'
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentExportRequest'
      responses:
        '202':
          description: Export queued, rendering, or already available under the same idempotency identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permission: ordinary-session
      x-page-contracts:
      - B01
      - B02
      - B03
      - B04
      - B05
      - B06
      - B07
      x-runtime-status: new
      x-export-source-state: ready
      x-write-readback: required
  /document-exports/{publicExportId}:
    get:
      summary: Read the current state of one document export.
      operationId: getDocumentExport
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/PublicExportId'
      responses:
        '200':
          description: Current export state and immutable generation identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permission: ordinary-session
      x-page-contracts:
      - B01
      - B02
      - B03
      - B04
      - B05
      - B06
      - B07
      x-runtime-status: new
  /document-exports/{publicExportId}/download:
    get:
      summary: Read a short-lived controlled download URL for a ready export.
      operationId: getDocumentExportDownload
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/PublicExportId'
      responses:
        '200':
          description: Controlled URL, expiry, and immutable file checksum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExportDownloadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permission: ordinary-session
      x-page-contracts:
      - B01
      - B02
      - B03
      - B04
      - B05
      - B06
      - B07
      x-runtime-status: new
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: openclaw_session
  parameters:
    CsrfHeader:
      name: X-OpenClaw-CSRF
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    IdempotencyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,128}$
    AuditReasonHeader:
      name: X-Audit-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type:
        - string
        - 'null'
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      required: false
      schema:
        type:
        - string
        - 'null'
    PublicArtifactIdQuery:
      name: publicArtifactId
      in: query
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicProjectId:
      name: publicProjectId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicArtifactId:
      name: publicArtifactId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    DocumentRevisionNumber:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PublicExportId:
      name: publicExportId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicCreatorId:
      name: publicCreatorId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicTrackId:
      name: publicTrackId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicAccountId:
      name: publicAccountId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicAssetId:
      name: publicAssetId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicResourceId:
      name: publicResourceId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicDecisionId:
      name: publicDecisionId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicRunId:
      name: publicRunId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicPackageId:
      name: publicPackageId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicPostId:
      name: publicPostId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicReviewId:
      name: publicReviewId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    PublicTenantId:
      name: publicTenantId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    FulfillmentId:
      name: fulfillmentId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,160}$
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found without existence disclosure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Revision or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Valid syntax with invalid business fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Service unavailable without internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SchemaVersion:
      type: string
      const: media_web_business_pages_v2
    PublicId:
      type: string
      pattern: ^[A-Za-z0-9_-]{8,160}$
    Revision:
      type: integer
      minimum: 0
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type:
      - string
      - 'null'
      format: date-time
    StringList:
      type: array
      items:
        type: string
    Value:
      oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: array
        items:
          oneOf:
          - type: string
          - type: number
          - type: boolean
        maxItems: 100
      - type: 'null'
    StringValueMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Value'
    DocumentArtifactKind:
      type: string
      enum:
      - research_snapshot
      - asset_digest
      - decision_brief
      - creation_document
      - publishing_package
      - review_report
      - project_summary
    DocumentBodyAuthority:
      type: string
      enum:
      - internal
      - lark
    EditorMode:
      type: string
      enum:
      - web_edit
      - lark_edit
    DocumentPreviewStatus:
      type: string
      enum:
      - not_applicable
      - pending
      - synced
      - stale
      - conflict
      - failed
    LarkResourceType:
      type: string
      enum:
      - wiki
      - docx
      - bitable
    TrustedOrganizationResource:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          $ref: '#/components/schemas/LarkResourceType'
        url:
          type: string
          format: uri
          pattern: '^https://(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+feishu\.cn/(?:wiki|docx|base)/[A-Za-z0-9_-]{8,160}$'
        expiresAt:
          $ref: '#/components/schemas/NullableTimestamp'
      required:
      - resourceType
      - url
      - expiresAt
    DocumentRevisionState:
      type: string
      enum:
      - draft
      - generating
      - ready
      - failed
      - conflict
      - archived
    DocumentExportFormat:
      type: string
      enum:
      - docx
      - pdf
    DocumentExportState:
      type: string
      enum:
      - queued
      - rendering
      - ready
      - failed
    DocumentBlockId:
      type: string
      pattern: ^blk_[A-Za-z0-9_-]{4,156}$
    DocumentLinkMark:
      type: object
      additionalProperties: false
      properties:
        type:
          const: link
        href:
          type: string
          format: uri
        title:
          type:
          - string
          - 'null'
      required:
      - type
      - href
      - title
    DocumentMark:
      oneOf:
      - type: string
        enum:
        - bold
        - italic
        - underline
        - strike
        - inline_code
      - $ref: '#/components/schemas/DocumentLinkMark'
    DocumentInlineNode:
      type: object
      additionalProperties: false
      properties:
        type:
          const: text
        text:
          type: string
        marks:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DocumentMark'
      required:
      - type
      - text
      - marks
    DocumentRichTextBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          type: string
          enum:
          - paragraph
          - heading_1
          - heading_2
          - heading_3
          - heading_4
          - heading_5
          - heading_6
          - heading_7
          - heading_8
          - heading_9
          - quote
        attrs:
          type: object
          additionalProperties: false
        content:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInlineNode'
      required:
      - id
      - type
      - attrs
      - content
    DocumentListItem:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        content:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInlineNode'
        children:
          type: array
          items:
            $ref: '#/components/schemas/DocumentListBlock'
      required:
      - id
      - content
      - children
    DocumentListBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          type: string
          enum:
          - bullet_list
          - ordered_list
        attrs:
          type: object
          additionalProperties: false
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentListItem'
      required:
      - id
      - type
      - attrs
      - items
    DocumentTodoBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          const: todo_item
        attrs:
          type: object
          additionalProperties: false
          properties:
            checked:
              type: boolean
          required:
          - checked
        content:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInlineNode'
      required:
      - id
      - type
      - attrs
      - content
    DocumentCodeBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          const: code_block
        attrs:
          type: object
          additionalProperties: false
          properties:
            language:
              type:
              - string
              - 'null'
          required:
          - language
        text:
          type: string
      required:
      - id
      - type
      - attrs
      - text
    DocumentDividerBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          const: divider
        attrs:
          type: object
          additionalProperties: false
      required:
      - id
      - type
      - attrs
    DocumentCalloutBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          const: callout
        attrs:
          type: object
          additionalProperties: false
          properties:
            semanticTone:
              type: string
              enum:
              - info
              - success
              - warning
              - danger
          required:
          - semanticTone
        content:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInlineNode'
      required:
      - id
      - type
      - attrs
      - content
    DocumentImageBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          const: image
        attrs:
          type: object
          additionalProperties: false
          properties:
            publicResourceId:
              $ref: '#/components/schemas/PublicId'
            altText:
              type: string
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
            contentChecksum:
              type: string
              pattern: ^[a-f0-9]{64}$
          required:
          - publicResourceId
          - altText
          - width
          - height
          - contentChecksum
      required:
      - id
      - type
      - attrs
    DocumentAttachmentBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          const: attachment
        attrs:
          type: object
          additionalProperties: false
          properties:
            publicResourceId:
              $ref: '#/components/schemas/PublicId'
            fileName:
              type: string
              minLength: 1
            contentType:
              type: string
            contentChecksum:
              type: string
              pattern: ^[a-f0-9]{64}$
          required:
          - publicResourceId
          - fileName
          - contentType
          - contentChecksum
      required:
      - id
      - type
      - attrs
    DocumentTableCell:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        content:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInlineNode'
      required:
      - id
      - content
    DocumentTableRow:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        cells:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: '#/components/schemas/DocumentTableCell'
      required:
      - id
      - cells
    DocumentTableBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          const: table
        attrs:
          type: object
          additionalProperties: false
          properties:
            semanticPurpose:
              type: string
              enum:
              - general
              - storyboard
              - publishing_checklist
              - metric_snapshot
              - evidence_index
            headerRowCount:
              type: integer
              minimum: 1
              maximum: 1
          required:
          - semanticPurpose
          - headerRowCount
        rows:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: '#/components/schemas/DocumentTableRow'
      required:
      - id
      - type
      - attrs
      - rows
    DocumentDataSnapshotBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DocumentBlockId'
        type:
          const: data_snapshot
        attrs:
          type: object
          additionalProperties: false
          properties:
            semanticPurpose:
              type: string
              enum:
              - metric_snapshot
              - evidence_index
            publicObjectId:
              $ref: '#/components/schemas/PublicId'
            sourceRevision:
              type: integer
              minimum: 1
            capturedAt:
              $ref: '#/components/schemas/Timestamp'
            displayFields:
              $ref: '#/components/schemas/StringValueMap'
          required:
          - semanticPurpose
          - publicObjectId
          - sourceRevision
          - capturedAt
          - displayFields
      required:
      - id
      - type
      - attrs
    DocumentBlock:
      oneOf:
      - $ref: '#/components/schemas/DocumentRichTextBlock'
      - $ref: '#/components/schemas/DocumentListBlock'
      - $ref: '#/components/schemas/DocumentTodoBlock'
      - $ref: '#/components/schemas/DocumentCodeBlock'
      - $ref: '#/components/schemas/DocumentDividerBlock'
      - $ref: '#/components/schemas/DocumentCalloutBlock'
      - $ref: '#/components/schemas/DocumentImageBlock'
      - $ref: '#/components/schemas/DocumentAttachmentBlock'
      - $ref: '#/components/schemas/DocumentTableBlock'
      - $ref: '#/components/schemas/DocumentDataSnapshotBlock'
      discriminator:
        propertyName: type
        mapping:
          paragraph: '#/components/schemas/DocumentRichTextBlock'
          heading_1: '#/components/schemas/DocumentRichTextBlock'
          heading_2: '#/components/schemas/DocumentRichTextBlock'
          heading_3: '#/components/schemas/DocumentRichTextBlock'
          heading_4: '#/components/schemas/DocumentRichTextBlock'
          heading_5: '#/components/schemas/DocumentRichTextBlock'
          heading_6: '#/components/schemas/DocumentRichTextBlock'
          heading_7: '#/components/schemas/DocumentRichTextBlock'
          heading_8: '#/components/schemas/DocumentRichTextBlock'
          heading_9: '#/components/schemas/DocumentRichTextBlock'
          bullet_list: '#/components/schemas/DocumentListBlock'
          ordered_list: '#/components/schemas/DocumentListBlock'
          todo_item: '#/components/schemas/DocumentTodoBlock'
          quote: '#/components/schemas/DocumentRichTextBlock'
          code_block: '#/components/schemas/DocumentCodeBlock'
          divider: '#/components/schemas/DocumentDividerBlock'
          callout: '#/components/schemas/DocumentCalloutBlock'
          image: '#/components/schemas/DocumentImageBlock'
          attachment: '#/components/schemas/DocumentAttachmentBlock'
          table: '#/components/schemas/DocumentTableBlock'
          data_snapshot: '#/components/schemas/DocumentDataSnapshotBlock'
    DocumentBodyV1:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: string
          const: media.document.body.v1
        blocks:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/DocumentBlock'
      required:
      - schemaVersion
      - blocks
    DocumentArtifactRecord:
      type: object
      additionalProperties: false
      properties:
        publicArtifactId:
          $ref: '#/components/schemas/PublicId'
        publicProjectId:
          $ref: '#/components/schemas/PublicId'
        artifactKind:
          $ref: '#/components/schemas/DocumentArtifactKind'
        workspaceMode:
          type: string
          enum:
          - personal_web
          - organization_lark
        bodyAuthority:
          $ref: '#/components/schemas/DocumentBodyAuthority'
        editorMode:
          $ref: '#/components/schemas/EditorMode'
        previewStatus:
          $ref: '#/components/schemas/DocumentPreviewStatus'
        trustedOrganizationResource:
          oneOf:
          - $ref: '#/components/schemas/TrustedOrganizationResource'
          - type: 'null'
        currentRevision:
          type: integer
          minimum: 0
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - publicArtifactId
      - publicProjectId
      - artifactKind
      - workspaceMode
      - bodyAuthority
      - editorMode
      - previewStatus
      - trustedOrganizationResource
      - currentRevision
      - updatedAt
      oneOf:
      - properties:
          workspaceMode:
            const: personal_web
          bodyAuthority:
            const: internal
          editorMode:
            const: web_edit
          previewStatus:
            const: not_applicable
          trustedOrganizationResource:
            type: 'null'
      - properties:
          workspaceMode:
            const: organization_lark
          bodyAuthority:
            const: lark
          editorMode:
            const: lark_edit
          previewStatus:
            enum:
            - pending
            - synced
            - stale
            - conflict
            - failed
          trustedOrganizationResource:
            $ref: '#/components/schemas/TrustedOrganizationResource'
    DocumentRevisionRecord:
      type: object
      additionalProperties: false
      properties:
        publicArtifactId:
          $ref: '#/components/schemas/PublicId'
        artifactKind:
          $ref: '#/components/schemas/DocumentArtifactKind'
        bodyAuthority:
          $ref: '#/components/schemas/DocumentBodyAuthority'
        revision:
          type: integer
          minimum: 1
        baseRevision:
          type:
          - integer
          - 'null'
          minimum: 1
        state:
          $ref: '#/components/schemas/DocumentRevisionState'
        bodyChecksum:
          type: string
          pattern: ^[a-f0-9]{64}$
        remoteDocumentVersion:
          type:
          - string
          - 'null'
        body:
          $ref: '#/components/schemas/DocumentBodyV1'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
