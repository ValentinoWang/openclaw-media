    MediaStage1ErrorCode:
      type: string
      enum:
      - authentication_required
      - invalid_credentials
      - invalid_session
      - csrf_required
      - csrf_invalid
      - rate_limited
      - workspace_selection_required
      - workspace_not_found
      - workspace_access_denied
      - identity_link_required
      - identity_link_conflict
      - membership_inactive
      - binding_unavailable
      - binding_generation_stale
      - provision_state_conflict
      - provision_needs_attention
      - capability_unavailable_until_writer_migration
      - validation_error
      - conflict
      - not_found
      - forbidden
      - internal_error
    MediaStage1ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/MediaStage1ErrorCode'
        message:
          type: string
          minLength: 1
        field:
          type:
          - string
          - 'null'
        requestId:
          type: string
          minLength: 1
        retryable:
          type: boolean
      required:
      - code
      - message
      - field
      - requestId
      - retryable
    MediaStage1ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: string
          const: media-stage1-shared-v1
        error:
          $ref: '#/components/schemas/MediaStage1ErrorDetail'
      required:
      - schemaVersion
      - error
    MediaStage1RateLimitRule:
      type: object
      additionalProperties: false
      properties:
        windowSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        maxRequestsBySource:
          type: integer
          minimum: 1
          maximum: 100
        maxRequestsByAccount:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - windowSeconds
      - maxRequestsBySource
      - maxRequestsByAccount
    MediaStage1SecurityConfiguration:
      type: object
      additionalProperties: false
      properties:
        session:
          type: object
          additionalProperties: false
          required:
          - type
          - absoluteLifetimeSeconds
          - rememberMe
          - rotationTriggers
          - tokenEntropyBits
          - cookie
          properties:
            type:
              type: string
              const: opaque_server_session
            absoluteLifetimeSeconds:
              type: integer
              const: 28800
            rememberMe:
              type: boolean
              const: false
            rotationTriggers:
              type: array
              minItems: 3
              items:
                type: string
                enum:
                - login_success
                - privilege_change
                - password_reset
            tokenEntropyBits:
              type: integer
              minimum: 256
            cookie:
              type: object
              additionalProperties: false
              required:
              - secure
              - httpOnly
              - sameSite
              properties:
                secure:
                  type: boolean
                  const: true
                httpOnly:
                  type: boolean
                  const: true
                sameSite:
                  type: string
                  const: Lax
        csrf:
          type: object
          additionalProperties: false
          required:
          - requiredForMutations
          - binding
          - rotatesWithSession
          properties:
            requiredForMutations:
              type: boolean
              const: true
            binding:
              type: string
              const: session
            rotatesWithSession:
              type: boolean
              const: true
        rateLimit:
          type: object
          additionalProperties: false
          required:
          - dimensions
          - defaults
          - runtimeOverrides
          properties:
            dimensions:
              type: array
              minItems: 2
              uniqueItems: true
              items:
                type: string
                enum:
                - source
                - account
            defaults:
              type: object
              additionalProperties: false
              required:
              - login
              - verification_resend
              - password_recovery
              properties:
                login:
                  $ref: '#/components/schemas/MediaStage1RateLimitRule'
                verification_resend:
                  $ref: '#/components/schemas/MediaStage1RateLimitRule'
                password_recovery:
                  $ref: '#/components/schemas/MediaStage1RateLimitRule'
            runtimeOverrides:
              type: object
              additionalProperties: false
              required:
              - policy
              - maxRequests
              - windowSeconds
              - dimensions
              properties:
                policy:
                  type: string
                  const: stricter_only
                maxRequests:
                  type: string
                  const: decrease_only
                windowSeconds:
                  type: string
                  const: decrease_only
                dimensions:
                  type: string
                  const: cannot_remove
      required:
      - session
      - csrf
      - rateLimit
