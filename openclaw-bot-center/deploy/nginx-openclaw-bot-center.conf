server {
    listen 127.0.0.1:9080 default_server;
    listen [::1]:9080 default_server;
    server_name _;
    port_in_redirect off;

    root /var/www;

    include /etc/nginx/snippets/openclaw-opc.conf;

    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/javascript
        image/svg+xml;

    location = / {
        return 302 /openclaw/bots/;
    }

    location = /openclaw/media {
        try_files /openclaw/media/index.html =404;
    }

    location = /openclaw/media/register {
        try_files /openclaw/media/register.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /openclaw/media/login {
        try_files /openclaw/media/login.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /openclaw/media/verify {
        try_files /openclaw/media/verify.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /openclaw/media/recover {
        try_files /openclaw/media/recover.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /openclaw/media/reset {
        try_files /openclaw/media/reset.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /media.login.js {
        alias /var/www/openclaw/media/media.login.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /media.auth.css {
        alias /var/www/openclaw/media/media.auth.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
    }

    location = /mediaDesignTokens.css {
        alias /var/www/openclaw/media/mediaDesignTokens.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
    }

    # File-shaped aliases never serve a second login page.
    location = /openclaw/media/login.html {
        return 308 /openclaw/media/login;
    }

    location = /openclaw/media/login/ {
        return 308 /openclaw/media/login;
    }

    location = /openclaw/media/login/index.html {
        return 308 /openclaw/media/login;
    }

    # Historical releases and future static exports cannot become alternate
    # file-shaped login pages. Registered exact aliases above still win.
    location ~* /[^/]*login[^/]*\.html$ {
        return 404;
    }

    # Stage 1 personal identity endpoints are exact product-owned routes.
    # Keep the public URI unchanged when forwarding to the Media backend.
    location = /openclaw/auth/register {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/auth/verify-email {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/auth/verify-email/resend {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/auth/login {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/auth/recover {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/auth/reset {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/auth/logout {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
    }

    location = /openclaw/auth/feishu/start {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/auth/feishu/status {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/media/auth/feishu/start {
        proxy_pass http://127.0.0.1:8787/auth/feishu/start;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /openclaw/media/auth/feishu/status {
        return 404;
    }

    location = /openclaw/media/oauth/callback {
        proxy_pass http://127.0.0.1:8787/auth/feishu/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/media/auth/logout {
        proxy_pass http://127.0.0.1:8787/auth/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /openclaw/media/auth/registration-policy {
        return 404;
    }

    location = /openclaw/media/auth/register {
        proxy_pass http://127.0.0.1:8787/auth/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /openclaw/media/auth/check {
        proxy_pass http://127.0.0.1:8787/auth/check;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/media/auth/status {
        proxy_pass http://127.0.0.1:8787/auth/status;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # Unregistered legacy Media auth routes are closed at the transport boundary.
    # Exact OAuth routes above still win before this prefix location.
    location ^~ /openclaw/media/auth/ {
        return 404;
    }

    location = /openclaw/bots/ingest {
        return 404;
    }

    location = /openclaw/bots/qqbot/event {
        return 404;
    }

    location = /__openclaw_bot_center_auth_check {
        internal;
        proxy_pass http://127.0.0.1:8787/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @openclaw_bot_center_login {
        return 302 /openclaw/media/login?next=$request_uri;
    }

    location /openclaw/bots/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /media/api/session {
        proxy_pass http://127.0.0.1:8787/media/api/session;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/media/api/session {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /openclaw/media/api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 4h;
        client_max_body_size 70m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /openclaw/media/assets {
        try_files /openclaw/media/index.html =404;
    }

    location /openclaw/media/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /openclaw/media/data/ {
        return 404;
    }

    location /openclaw/media/ {
        error_page 405 =404 @openclaw_static_not_found;
        try_files $uri $uri/ /openclaw/media/index.html;
    }

    location @openclaw_static_not_found {
        return 404;
    }

    location /openclaw/bots/assets/ {
        auth_request /__openclaw_bot_center_auth_check;
        error_page 401 = @openclaw_bot_center_login;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /openclaw/bots/data/ {
        auth_request /__openclaw_bot_center_auth_check;
        error_page 401 = @openclaw_bot_center_login;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /openclaw/bots/ {
        auth_request /__openclaw_bot_center_auth_check;
        error_page 401 = @openclaw_bot_center_login;
        try_files /openclaw/bots/index.html =404;
    }

    location /openclaw/bots/ {
        return 404;
    }
}
