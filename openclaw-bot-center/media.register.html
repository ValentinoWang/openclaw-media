<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>创建个人账号 - MediaClaw</title>
    <!-- vite-ignore -->
    <link rel="stylesheet" href="/media.auth.css" />
  </head>
  <body class="auth-page" data-auth-page="register">
    <main class="auth-shell compact-shell" aria-labelledby="page-title">
      <header class="auth-header">
        <a class="brand" href="/openclaw/media/" aria-label="MediaClaw 内容运营工作台">
          <span class="brand-mark" aria-hidden="true">MC</span>
          <span><strong class="brand-name">MediaClaw</strong><span class="brand-detail">内容运营工作台</span></span>
        </a>
        <p class="eyebrow">个人账号</p>
        <h1 id="page-title">创建个人账号</h1>
        <p class="lede">注册只需要用户名、唯一邮箱和密码。</p>
      </header>
      <section class="auth-panel standalone-panel" aria-labelledby="register-heading">
        <div class="panel-heading">
          <span class="panel-label">C 个人创作者</span>
          <h2 id="register-heading">开始使用 MediaClaw</h2>
          <p>提交后请在 24 小时内完成邮箱验证。注册和验证都不会自动登录。</p>
          <div class="auth-access-help" role="note" aria-label="注册准入说明">
            <strong>注册需要邀请或准入码</strong>
            <p>请先联系平台管理员获取邀请链接或一次性准入码；提交表单时按页面提示填写，准入码只使用一次并受批次有效期限制。</p>
            <p>管理员进入方式：先在此页面登录管理员账号，再打开 <a class="text-link" href="/openclaw/media/admin/access">管理员准入中心</a>，可签发准入码批次、管理邀请权限和调整注册策略。</p>
          </div>
        </div>
        <form id="register-form" class="auth-form" novalidate>
          <label class="field" for="username">
            <span>用户名</span>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="64" pattern="[\p{L}\p{N}][\p{L}\p{N}\p{M}._\-]{2,63}" required />
            <small>3-64 个字符，支持中文、字母、数字和 . _ -，以文字或数字开头。</small>
          </label>
          <label class="field" for="email">
            <span>唯一邮箱</span>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </label>
          <label class="field" for="password">
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
            <small>至少 8 个字符，可使用字母、数字、符号或短语；过于常见的密码不可用。</small>
          </label>
          <label class="field" for="admission-code">
            <span>邀请链接或准入码</span>
            <input id="admission-code" name="admissionCode" type="text" autocomplete="one-time-code" maxlength="160" placeholder="粘贴管理员提供的邀请链接或准入码" required />
            <small>没有邀请链接或准入码时，请联系管理员；管理员不会通过公开页面展示可用码。</small>
          </label>
          <div class="form-actions">
            <button class="auth-button primary" id="register-submit" type="submit">创建账号</button>
          </div>
        </form>
        <p class="auth-message" id="register-error" role="alert" aria-live="polite"></p>
        <div class="success-panel" id="register-success" role="status" aria-live="polite" hidden>
          <span class="success-mark" aria-hidden="true">✓</span>
          <div>
            <strong>注册已提交</strong>
            <p id="register-success-message">请检查邮箱并使用最新验证邮件完成账号启用。完成后请返回登录。</p>
          </div>
          <button class="auth-button secondary" id="register-resend" type="button">重发验证邮件</button>
          <p class="auth-message" id="register-resend-message" role="status" aria-live="polite"></p>
          <a class="auth-button primary" id="register-login-link" href="/openclaw/media/login">返回登录</a>
        </div>
        <p class="auth-foot"><a class="text-link" id="register-login-secondary" href="/openclaw/media/login">已有账号？返回登录</a></p>
      </section>
    </main>
    <script type="module" src="/media.login.js"></script>
  </body>
</html>
