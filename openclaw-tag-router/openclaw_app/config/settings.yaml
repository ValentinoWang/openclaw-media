workspace_root: /home/ubuntu/.openclaw/workspace/openclaw-tag-router
source: feishu
chat_type: private
timezone: Asia/Shanghai
daily_journal:
  daily_prompt_time: "22:00"
  weekly_summary_time: "23:59"
  journal_root: /home/ubuntu/obsidian-日记/日记
  weekly_archive_root: /home/ubuntu/obsidian-日记/Archieve
  minimum_weekly_samples: 3
  notification_channel: feishu
  notification_account: daily
  notification_target: ""
  notification_sessions_path: /home/ubuntu/.openclaw/agents/feishu-daily/sessions/sessions.json
  scheduler_state_path: /home/ubuntu/.openclaw/workspace/openclaw-tag-router/daily_journal_scheduler/state.json
entry_tag_rules:
  社交:
    default_tags: [社交, 人物档案]
    feishu_doc: 社交档案记录
content_flow:
  base_url: http://127.0.0.1:8000
  poll_interval_seconds: 1
  poll_attempts: 900
feishu_reminder:
  enabled: true
  command: /usr/bin/python3
  script: /home/ubuntu/openclaw-feishu-reminder/reminder.py
  timeout_seconds: 720
  bitable_url: https://tcnwueberajc.feishu.cn/base/Q7n4bucuGa3I2psTOyLcuepknkh
  config_paths:
    活动: /home/ubuntu/openclaw-feishu-reminder/wiki-activity-config.json
    自媒体知识: /home/ubuntu/openclaw-feishu-reminder/knowledge-config.json
    知识: /home/ubuntu/openclaw-feishu-reminder/knowledge-config.json
  env_files:
    - /home/ubuntu/.openclaw/openclaw-feishu-env.conf
    - /home/ubuntu/openclaw-feishu-reminder/reminder.env
deepmath_ceo_thinking:
  enabled: true
  resource_config_path: /home/ubuntu/selfmedia-tools/openclaw-tag-router/config/deepmath_ceo_thinking_resources.json
feishu:
  # 需要入飞书知识库请改为 knowledge_base；webhook 模式只走应用消息/网关
  mode: knowledge_base
  local_docs_dir: /home/ubuntu/.openclaw/workspace/openclaw-tag-router/outbox/feishu_docs
  webhook_url: ''
  app_id: ${FEISHU_APP_ID}
  app_secret: ${FEISHU_APP_SECRET}
  api_base_url: https://open.feishu.cn/open-apis
  web_base_url: https://tcnwueberajc.feishu.cn
  folder_token: ''
  knowledge_base_space_id: ${FEISHU_KB_SPACE_ID}
  knowledge_base_parent_node_token: ${FEISHU_KB_PARENT_NODE_TOKEN}
  knowledge_base_obj_type: docx
  # 支持按文档名匹配多个知识库空间（按顺序匹配，最后一个作为默认空间）
  knowledge_base_spaces:
    - name: "知识库-技术"
      pattern: "*技术*"
      space_id: ${FEISHU_KB_SPACE_ID_TECH}
      parent_node_token: ${FEISHU_KB_PARENT_NODE_TOKEN_TECH}
    - name: "知识库-会议"
      pattern: "会议*"
      space_id: ${FEISHU_KB_SPACE_ID_MEETING}
      parent_node_token: ${FEISHU_KB_PARENT_NODE_TOKEN_MEETING}
    - pattern: "*"
      space_id: ${FEISHU_KB_SPACE_ID}
      parent_node_token: ${FEISHU_KB_PARENT_NODE_TOKEN}
mac_agent:
  mode: local
  queue_dir: /home/ubuntu/.openclaw/workspace/openclaw-tag-router/outbox/mac_agent_queue
  obsidian_root: /home/ubuntu/obsidian-日记/日程
  local_obsidian_root: /home/ubuntu/obsidian-日记/日程
reply:
  include_paths: true
